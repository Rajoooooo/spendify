# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - castrovenalspendify1130

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # Install PHP dependencies
      - name: Install Composer dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Install NPM dependencies
      - name: Install NPM dependencies
        run: npm ci

      # Build frontend assets (Vite)
      - name: Build assets
        run: npm run build

      # Upload ONLY necessary files for deployment
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: |
            .
            !node_modules/
            !tests/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B2634FE1ADF049FDA9BF87E228311E73 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B888D82154474D9EA66C8B5A302BD8B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A292D39513774403A6A7F29D9B6CF1A2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'castrovenalspendify1130'
          slot-name: 'Production'
          package: .
