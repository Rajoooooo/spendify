# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Laravel app to Azure Web App - castrovenalspendify1130

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -----------------------------
      # PHP + Composer
      # -----------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql, bcmath, openssl
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader

      # -----------------------------
      # Node + Vite build
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets (Vite)
        run: npm run build

      # -----------------------------
      # Laravel optimizations
      # -----------------------------
      - name: Laravel optimizations
        run: |
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # -----------------------------
      # Upload artifact for deployment
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: laravel-app
          path: |
            .
            !node_modules/
            !tests/
            !storage/logs/*
            !storage/framework/cache/data/*

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: laravel-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B2634FE1ADF049FDA9BF87E228311E73 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B888D82154474D9EA66C8B5A302BD8B7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A292D39513774403A6A7F29D9B6CF1A2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'castrovenalspendify1130'
          slot-name: 'Production'
          package: .
